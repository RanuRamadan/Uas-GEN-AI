<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIGAP AI - Riwayat Laporan</title>
<link rel="stylesheet" href="css/progress.css">
</head>
<body>

    <div class="progress-container">

        <div class="progress-header">
            <div class="header-icon">📋</div>
            <div>
                <h1>Riwayat Laporan</h1>
                <p>Pantau status aduan yang sudah Anda kirim</p>
            </div>
        </div>

        <div class="search-box">
            <input
                type="tel"
                id="nomorHpInput"
                placeholder="Masukkan nomor HP Anda, mis. 081234567890"
                autocomplete="tel"
            >
            <button id="cekBtn">Cek Riwayat</button>
        </div>

        <div id="resultArea">
            <div class="empty-state">
                <div class="empty-icon">🔍</div>
                <p>Masukkan nomor HP yang Anda gunakan saat melapor untuk melihat status laporan Anda.</p>
            </div>
        </div>

        <a href="chat.html" class="back-link">← Kembali ke Chat</a>

    </div>

    <script src="js/progress.js"></script>
</body>
</html>
